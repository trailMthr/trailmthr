name: trailmthr_test2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  geolocator: ^13.0.1
  path_provider: ^2.1.2
  flutter_map_tile_caching: ^10.1.1


  webview_flutter: ^4.7.0

  # Storage + GPX/FIT/TCX handling
  sqflite: ^2.4.2
